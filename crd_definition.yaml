apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: resilientdeployments.cosc3657.local

spec:
  group: cosc3657.local

  names:
    plural: resilientdeployments
    singular: resilientdeployment
    kind: ResilientDeployment
    shortNames:
      - rd

  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3

                image:
                  type: string
                  default: nginx:1.27

              required:
                - replicas
                - image
